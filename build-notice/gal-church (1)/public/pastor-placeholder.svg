<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#073063" />
      <stop offset="50%" stop-color="#0D559A" />
      <stop offset="100%" stop-color="#08284F" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#198AD6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#073063" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#bgGrad)" />
  <circle cx="300" cy="240" r="280" fill="url(#glow)" />

  <!-- Subtle Minimal Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="750" stroke="#FFFFFF" stroke-opacity="0.04" />
  <line x1="300" y1="0" x2="300" y2="750" stroke="#FFFFFF" stroke-opacity="0.06" />
  <line x1="500" y1="0" x2="500" y2="750" stroke="#FFFFFF" stroke-opacity="0.04" />

  <!-- Pastor Figure Silhouette (Contemporary & Warm) -->
  <!-- Head & Hair -->
  <ellipse cx="300" cy="250" rx="85" ry="110" fill="#E2E8F0" />
  <path d="M210 240C210 160 250 140 300 140C350 140 390 160 390 240C370 210 340 190 300 190C260 190 230 210 210 240Z" fill="#1E293B" />
  
  <!-- Neck -->
  <rect x="270" y="340" width="60" height="70" rx="10" fill="#CBD5E1" />

  <!-- Shirt Collar & Suit -->
  <path d="M120 750C120 530 200 420 255 400L280 470H320L345 400C400 420 480 530 480 750Z" fill="#0A1E38" />
  <polygon points="280,420 320,420 300,510" fill="#FFFFFF" />
  <polygon points="295,430 305,430 300,530" fill="#073063" />

  <!-- Brand watermark badge -->
  <g transform="translate(40, 40)">
    <rect width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" />
    <text x="90" y="22" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF" letter-spacing="1">GAL CHURCH</text>
  </g>

  <!-- Name text plate -->
  <g transform="translate(50, 640)">
    <rect width="500" height="70" rx="20" fill="#031630" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="35" y="42" font-family="'Pretendard', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">이대희 목사</text>
    <text x="170" y="42" font-family="'Manrope', sans-serif" font-weight="500" font-size="15" fill="#93C5FD">Lead Pastor · GAL Church</text>
  </g>
</svg>
